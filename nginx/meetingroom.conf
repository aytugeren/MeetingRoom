# Bu dosya NPM kullanıcıları için REFERANS AMAÇLIDIR.
# NPM'de "Advanced" sekmesine aşağıdaki location bloğunu yapıştır.
# Tam conf olarak kullanmak istersen: /etc/nginx/sites-available/ altına koy.

upstream meetingroom_app {
    server localhost:5500;
    keepalive 32;
}

server {
    listen 80;
    server_name meeting.aytugeren.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meeting.aytugeren.com;

    ssl_certificate     /etc/letsencrypt/live/meeting.aytugeren.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meeting.aytugeren.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 55M;

    location / {
        proxy_pass         http://meetingroom_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_cache_bypass  $http_upgrade;
    }
}
