# /etc/nginx/sites-available/meetingroom.conf
# yourdomain.com → meetingroom container (port 5500)

upstream meetingroom_app {
    server localhost:5500;   # container expose etmiyorsa: meetingroom:5500 (Docker network)
    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Dosya yükleme — 50 MB
    client_max_body_size 55M;

    # SignalR WebSocket + SSE için kritik
    location / {
        proxy_pass         http://meetingroom_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_cache_bypass  $http_upgrade;
    }
}
