<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meeting — MeetingRoom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#6366f1' } } }
    };
  </script>
</head>
<body class="dark h-full bg-gray-950 text-gray-100 flex flex-col overflow-hidden">

  <!-- ── Name prompt overlay (shown when no name in sessionStorage) ────────── -->
  <div id="namePrompt" class="hidden fixed inset-0 bg-gray-950/95 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8 max-w-sm w-full shadow-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 mb-3 shadow-lg shadow-indigo-500/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold">Join Meeting</h2>
        <p class="text-gray-400 text-sm mt-1">
          Room: <span id="promptRoomCode" class="font-mono text-indigo-400 font-bold tracking-widest"></span>
        </p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Your Name</label>
          <input id="promptName" type="text" placeholder="Enter your name" autocomplete="name"
            class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-gray-100
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500
                   focus:border-transparent transition" />
        </div>
        <button id="promptJoinBtn"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold
                 transition focus:outline-none focus:ring-2 focus:ring-indigo-400">
          Join Meeting
        </button>
      </div>
    </div>
  </div>

  <!-- ── Top toolbar ────────────────────────────────────────────────────────── -->
  <header class="flex items-center justify-between px-3 py-2 bg-gray-900 border-b border-gray-800 shrink-0 gap-2">

    <!-- Left: room info -->
    <div class="flex items-center gap-2 min-w-0">
      <div class="hidden sm:flex w-8 h-8 rounded-lg bg-indigo-600 items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="hidden sm:inline font-semibold text-sm">Room:</span>
          <code id="roomCodeDisplay" class="font-mono text-indigo-400 font-bold tracking-widest text-sm"></code>
          <button id="copyCodeBtn" title="Copy room code" class="text-gray-500 hover:text-gray-300 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-1">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-yellow-400 shrink-0"></span>
          <span id="statusText" class="text-xs text-gray-400 hidden sm:inline">Connecting…</span>
        </div>
      </div>
    </div>

    <!-- Center: media controls (desktop only — mobile uses bottom bar) -->
    <div id="desktopControls" class="hidden sm:flex items-center gap-2">
      <button id="muteBtn" title="Toggle microphone" class="toolbar-btn bg-gray-700 hover:bg-gray-600">
        <svg id="micOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
        </svg>
        <svg id="micOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>

      <button id="cameraBtn" title="Toggle camera" class="toolbar-btn bg-gray-700 hover:bg-gray-600">
        <svg id="camOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
        <svg id="camOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"/>
        </svg>
      </button>

      <button id="screenBtn" title="Share screen" class="toolbar-btn bg-gray-700 hover:bg-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs font-medium ml-1">Share</span>
      </button>

      <button id="recordBtn" title="Record meeting" class="toolbar-btn bg-gray-700 hover:bg-gray-600">
        <svg id="recordStartIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="7" fill="#ef4444"/>
        </svg>
        <svg id="recordStopIcon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2" fill="white"/>
        </svg>
        <span id="recordBtnLabel" class="text-xs font-medium ml-1">Record</span>
      </button>

      <div class="w-px h-6 bg-gray-700 mx-1"></div>

      <button id="leaveBtn" class="toolbar-btn bg-red-700 hover:bg-red-600 text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span class="text-xs font-medium ml-1">Leave</span>
      </button>
    </div>

    <!-- Right: sidebar toggles -->
    <div class="flex items-center gap-1.5">
      <button id="participantsBtn" title="Participants"
        class="toolbar-btn bg-gray-700 hover:bg-gray-600 relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span id="participantCount"
          class="absolute -top-1 -right-1 w-4 h-4 bg-indigo-500 rounded-full text-xs flex items-center justify-center font-bold">1</span>
      </button>

      <button id="chatBtn" title="Chat"
        class="toolbar-btn bg-gray-700 hover:bg-gray-600 relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span id="unreadBadge"
          class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center font-bold">0</span>
      </button>

      <!-- Leave button visible on mobile in header area (also in bottom bar) -->
      <button id="leaveBtnMobile" class="sm:hidden toolbar-btn bg-red-700 hover:bg-red-600 text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Main content area ──────────────────────────────────────────────────── -->
  <div class="flex flex-1 overflow-hidden min-h-0">

    <!-- Video area -->
    <main class="flex-1 p-2 sm:p-3 overflow-hidden flex flex-col min-h-0 mobile-content-area" id="videoArea">

      <!-- Screen share prominent view -->
      <div id="screenShareView" class="hidden mb-2 sm:mb-3 relative bg-black rounded-xl overflow-hidden">
        <video id="screenShareVideo" autoplay playsinline class="w-full h-full object-contain"></video>
        <div id="screenShareLabel"
          class="absolute top-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded-lg flex items-center gap-1">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2 4a1 1 0 011-1h14a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/>
          </svg>
          Screen Share
        </div>
        <!-- Remote control overlay -->
        <div id="remoteControlOverlay" class="hidden absolute inset-0 border-2 border-indigo-500 pointer-events-none">
          <div class="absolute top-2 right-2 bg-indigo-600/90 text-white text-xs px-3 py-1.5 rounded-lg font-medium">
            Remote Control Active
          </div>
        </div>
        <!-- Focus mode button -->
        <button id="focusModeBtn"
          class="hidden absolute bottom-2 left-2 bg-gray-800/90 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
          Focus
        </button>
        <!-- Request control button -->
        <button id="requestControlBtn"
          class="hidden absolute bottom-2 right-2 bg-gray-800/90 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
          Request Control
        </button>
      </div>

      <!-- Video grid -->
      <div id="videoGrid"
        class="flex-1 grid gap-2 overflow-hidden"
        style="grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); grid-auto-rows: 1fr; align-content: start;">
      </div>
    </main>

    <!-- Sidebar -->
    <aside id="sidebar"
      class="hidden bg-gray-900 border-l border-gray-800 flex flex-col overflow-hidden shrink-0 sidebar-panel">

      <!-- Tab bar -->
      <div class="flex border-b border-gray-800 shrink-0">
        <button id="tabParticipants"
          class="sidebar-tab flex-1 py-3 text-sm font-medium border-b-2 border-indigo-500 text-indigo-400">
          Participants
        </button>
        <button id="tabChat"
          class="sidebar-tab flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200">
          Chat
        </button>
      </div>

      <!-- Participants panel -->
      <div id="panelParticipants" class="flex-1 overflow-y-auto p-3 space-y-1"></div>

      <!-- Chat panel -->
      <div id="panelChat" class="hidden flex-1 flex flex-col overflow-hidden">
        <div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-3"></div>

        <div class="px-3 pb-1">
          <label for="fileInput"
            class="inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-gray-200 cursor-pointer transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
            </svg>
            Attach File (max 50 MB)
          </label>
          <input type="file" id="fileInput" class="hidden" />
        </div>

        <div class="p-3 border-t border-gray-800 flex gap-2">
          <input id="chatInput" type="text" placeholder="Send a message…"
            class="flex-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-100
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
          <button id="sendBtn" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- ── Mobile bottom toolbar ──────────────────────────────────────────────── -->
  <div id="mobileToolbar"
    class="sm:hidden flex items-center justify-around bg-gray-900 border-t border-gray-800 shrink-0 px-2 py-2 mobile-toolbar-safe">

    <button id="muteBtnMobile" title="Mikrofon" class="toolbar-btn bg-gray-700 hover:bg-gray-600 flex-col gap-0.5 !py-1.5 !px-3">
      <svg id="micOnIconMobile" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
      </svg>
      <svg id="micOffIconMobile" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
      </svg>
      <span class="text-xs text-gray-400">Mic</span>
    </button>

    <button id="cameraBtnMobile" title="Kamera" class="toolbar-btn bg-gray-700 hover:bg-gray-600 flex-col gap-0.5 !py-1.5 !px-3">
      <svg id="camOnIconMobile" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      </svg>
      <svg id="camOffIconMobile" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 10l4.553-2.069A1 1 0 0121 8.869v6.262a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"/>
      </svg>
      <span class="text-xs text-gray-400">Camera</span>
    </button>

    <button id="screenBtnMobile" title="Ekran paylaş" class="toolbar-btn bg-gray-700 hover:bg-gray-600 flex-col gap-0.5 !py-1.5 !px-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <span id="screenBtnMobileLabel" class="text-xs text-gray-400">Share</span>
    </button>

    <button id="recordBtnMobile" title="Kayıt" class="toolbar-btn bg-gray-700 hover:bg-gray-600 flex-col gap-0.5 !py-1.5 !px-3">
      <svg id="recordStartIconMobile" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="7" fill="#ef4444"/>
      </svg>
      <svg id="recordStopIconMobile" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="5" width="14" height="14" rx="2" fill="white"/>
      </svg>
      <span id="recordBtnMobileLabel" class="text-xs text-gray-400">Rec</span>
    </button>

    <button id="leaveBtnMobile2" class="toolbar-btn bg-red-700 hover:bg-red-600 text-white flex-col gap-0.5 !py-1.5 !px-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="text-xs">Leave</span>
    </button>
  </div>

  <!-- ── Remote control request modal ──────────────────────────────────────── -->
  <div id="controlRequestModal"
    class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <h3 class="font-semibold text-lg mb-2">Remote Control Request</h3>
      <p id="controlRequestText" class="text-gray-400 text-sm mb-5"></p>
      <div class="flex gap-3">
        <button id="acceptControlBtn"
          class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition">Allow</button>
        <button id="denyControlBtn"
          class="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-xl font-medium transition">Deny</button>
      </div>
    </div>
  </div>

  <!-- YouTube invisible player mount (replaced by iframe by YT API) -->
  <div style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
    <div id="ytPlayer"></div>
  </div>

  <!-- YouTube music widget (shown when music is playing) -->
  <div id="youtubeWidget"
    class="hidden fixed bottom-20 sm:bottom-5 left-5 z-40 bg-gray-800 border border-gray-700 rounded-xl p-3 shadow-xl flex items-center gap-3"
    style="min-width:240px;max-width:300px;">
    <div class="flex flex-col flex-1 min-w-0 gap-1.5">
      <div class="flex items-center gap-2 min-w-0">
        <svg class="w-4 h-4 text-red-500 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/>
        </svg>
        <span id="ytWidgetTitle" class="text-xs font-medium text-gray-200 truncate">Playing...</span>
      </div>
      <div class="flex items-center gap-2">
        <svg class="w-3 h-3 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" id="ytVolumeSlider" min="0" max="100" value="20"
          class="flex-1 accent-indigo-500 cursor-pointer" style="height:4px;" />
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="ytPlayPauseBtn" title="Play/Pause"
        class="w-8 h-8 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded-full transition">
        <svg id="ytPlayIcon" class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="ytPauseIcon" class="w-4 h-4 text-white hidden" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>
      <button id="ytStopBtn" title="Stop music"
        class="w-8 h-8 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded-full transition text-gray-300 hover:text-red-400">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 6h12v12H6z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="fixed bottom-20 sm:bottom-5 right-5 space-y-2 z-50"></div>

  <script src="/js/app.js"></script>
</body>
